name: Deploy Potential Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir _site

          # Copy the whole project
          cp -R "BUSINESS DASHBOARD" "_site/BUSINESS DASHBOARD"
          cp -R "student dashboard" "_site/student dashboard"

          # Copy root files
          cp auth.html _site/
          cp supabase-client.js _site/
          cp supabase-config.js _site/

          # Put landing page at website root
          cp -R "landing page"/. _site/

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
