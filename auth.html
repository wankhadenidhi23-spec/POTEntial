
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login / Sign Up - POTential</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .tabs {
            display: flex;
            margin-bottom: 25px;
        }

        .tabs button {
            width: 50%;
            padding: 12px;
            border: none;
            background: #eee;
            cursor: pointer;
            font-size: 16px;
        }

        .tabs button.active {
            background: #111;
            color: white;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .submit-btn {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="auth-container">

    <div class="logo">
        POTential
    </div>

    <div class="tabs">
        <button id="loginTab" class="active">Login</button>
        <button id="signupTab">Sign Up</button>
    </div>

    <!-- LOGIN -->

    <form id="loginForm" class="form active">

        <label>Email</label>
        <input
            type="email"
            id="loginEmail"
            required
            placeholder="Enter your email"
        >

        <label>Password</label>
        <input
            type="password"
            id="loginPassword"
            required
            placeholder="Enter your password"
        >

        <button type="submit" class="submit-btn">
            Login
        </button>

    </form>


    <!-- SIGN UP -->

    <form id="signupForm" class="form">

        <label>Full Name</label>
        <input
            type="text"
            id="signupName"
            required
            placeholder="Enter your full name"
        >

        <label>Email</label>
        <input
            type="email"
            id="signupEmail"
            required
            placeholder="Enter your email"
        >

        <label>Password</label>
        <input
            type="password"
            id="signupPassword"
            required
            placeholder="Create a password"
        >

        <label>Role</label>

        <select id="signupRole" required>
            <option value="">Select your role</option>
            <option value="student">Student</option>
            <option value="business">Business</option>
        </select>

        <button type="submit" class="submit-btn">
            Create Account
        </button>

    </form>


    <div id="message" class="message"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


// =====================================================
// ELEMENTS
// =====================================================

const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");

const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");

const message = document.getElementById("message");


// =====================================================
// TAB SWITCHING
// =====================================================

loginTab.addEventListener("click", () => {

    loginTab.classList.add("active");
    signupTab.classList.remove("active");

    loginForm.classList.add("active");
    signupForm.classList.remove("active");

    message.textContent = "";
});


signupTab.addEventListener("click", () => {

    signupTab.classList.add("active");
    loginTab.classList.remove("active");

    signupForm.classList.add("active");
    loginForm.classList.remove("active");

    message.textContent = "";
});


// =====================================================
// LOGIN
// =====================================================

loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    message.textContent = "Logging in...";


    // ---------------------------------------------
    // 1. LOGIN THROUGH SUPABASE AUTH
    // ---------------------------------------------

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });


    if (error) {

        message.textContent =
            "Login Error: " + error.message;

        return;
    }


    const user = data.user;

    console.log("Logged in user:", user);


    // ---------------------------------------------
    // 2. GET USER PROFILE
    // ---------------------------------------------

    const { data: profile, error: profileError } =
        await supabaseClient
            .from("profiles")
            .select("Role")
            .eq("user_id", user.id)
            .maybeSingle();


    console.log("Profile:", profile);
    console.log("Profile Error:", profileError);


    if (profileError) {

        message.textContent =
            "Profile Error: " + profileError.message;

        return;
    }


    // ---------------------------------------------
    // 3. PROFILE DOES NOT EXIST
    // ---------------------------------------------

    if (!profile) {

        message.textContent =
            "Profile not found. Please contact the administrator.";

        return;
    }


    // ---------------------------------------------
    // 4. STUDENT
    // ---------------------------------------------

    if (profile.Role === "student") {

        message.textContent =
            "Login successful!";

        window.location.href =
            "../student dashboard/student-dashboard.html";

        return;
    }


    // ---------------------------------------------
    // 5. BUSINESS
    // ---------------------------------------------

    if (profile.Role === "business") {

        message.textContent =
            "Login successful!";

        window.location.href =
            "businessprofile.html";

        return;
    }


    // ---------------------------------------------
    // 6. INVALID ROLE
    // ---------------------------------------------

    message.textContent =
        "Invalid role found in profile: " + profile.Role;

});


// =====================================================
// SIGN UP
// =====================================================

signupForm.addEventListener("submit", async (event) => {

    event.preventDefault();


    const name =
        document.getElementById("signupName").value.trim();

    const email =
        document.getElementById("signupEmail").value.trim();

    const password =
        document.getElementById("signupPassword").value;

    const role =
        document.getElementById("signupRole").value;


    if (!role) {

        message.textContent =
            "Please select Student or Business.";

        return;
    }


    message.textContent =
        "Creating account...";


    // ---------------------------------------------
    // CREATE SUPABASE AUTH USER
    // ---------------------------------------------

    const { data, error } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {

                    full_name: name,

                    role: role

                }

            }

        });


    if (error) {

        message.textContent =
            "Signup Error: " + error.message;

        console.error(error);

        return;
    }


    console.log("Signup result:", data);


    // ---------------------------------------------
    // CHECK USER
    // ---------------------------------------------

    if (!data.user) {

        message.textContent =
            "Account could not be created.";

        return;
    }


    // ---------------------------------------------
    // SUCCESS
    // ---------------------------------------------

    signupForm.reset();

    message.textContent =
        "Account created successfully! Please login.";

});

</script>
